name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP"

      - name: Selftest
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: scripts/selftest.sh

  hygiene:
    uses: ./.github/workflows/hygiene.yml
    secrets: inherit
